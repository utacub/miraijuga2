<style>/* Nunito local (OFL 1.1): funciona sense connexió */@font-face{font-family:"Nunito";font-style:normal;font-weight:200 1000;font-display:swap;src:url(fonts/nunito-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:"Nunito";font-style:normal;font-weight:200 1000;font-display:swap;src:url(fonts/nunito-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}</style>
<style>
:root{--ink:#1d2a3a;--ink2:#41526a;--glass:rgba(255,255,255,.78);--glass2:rgba(255,255,255,.16);--acc:#ff9f1c;--acc2:#ff6f3c;--teal:#0f766e;--sel:#0f766e;--shadow:0 1.2vmin 3.4vmin rgba(10,30,40,.28)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1a17;color:#fff;font-family:"Nunito","Segoe UI",system-ui,Roboto,Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
body.nocur,body.nocur *{cursor:none!important}
#c,#ov{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ov{pointer-events:none;z-index:80}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ic{width:1.1em;height:1.1em;vertical-align:-.18em;display:inline-block}
.scr{position:fixed;inset:0;display:none}
.scr.on{display:flex}

/* ---- portada ---- */
#start{z-index:30;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;text-align:center;padding:4vmin;overflow:hidden;background:#3c6e3a}
#start .bg{position:absolute;inset:0;background:url(portada/fons.webp) center/cover}
#start .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 30%,rgba(255,255,255,0) 0%,rgba(10,40,30,.18) 60%,rgba(8,30,22,.55) 100%)}
@keyframes kb{to{transform:scale(1.1) translate(-1%,1%)}}
#start .peek{position:absolute;bottom:0;height:24vmin;filter:drop-shadow(0 1vmin 1.4vmin rgba(0,0,0,.25));animation:peek 4.5s ease-in-out infinite}
#parade{position:absolute;left:21vmin;right:15vmin;bottom:1.6vmin;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#parade .pc{position:relative;height:11.5vmin;display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 100%;filter:drop-shadow(0 .8vmin .9vmin rgba(40,30,10,.3))}
#parade .pc.w{height:9vmin}#parade .pc.t{height:13.5vmin}
#parade .pc img,#parade .pc video{height:100%;width:auto;display:block}
#parade .pc video{position:absolute;bottom:0;left:50%;transform:translateX(-50%);visibility:hidden}
#parade .pc video.on{visibility:visible}
#parade .pc canvas.sac{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:100%;width:auto;display:block;visibility:hidden}#parade .pc.vid img{visibility:hidden}
#parade .pc.hop{animation:hola 1.8s ease-in-out}#parade .pc.flap img{animation:flap .45s ease-in-out 4}
@keyframes flap{50%{transform:scaleX(.55)}}
@keyframes hola{0%,100%{transform:none}25%{transform:translateY(-18%) rotate(-6deg)}55%{transform:translateY(-4%) rotate(5deg)}75%{transform:translateY(-9%)}}
@keyframes peek{0%,100%{transform:translateY(40%)}45%,70%{transform:translateY(6%)}}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;gap:2.6vmin}
#start h1{position:relative;white-space:nowrap;font-size:13vmin;font-weight:900;color:#fff;letter-spacing:.005em;line-height:1;text-shadow:0 .7vmin 0 #1f6f5c,0 1.6vmin 3vmin rgba(0,30,20,.45)}
#start h1 .two{display:inline-flex;align-items:center;justify-content:center;margin-left:.12em;width:1.05em;height:1.05em;border-radius:.32em;background:linear-gradient(145deg,#ffcf4a,#ff7b2c);color:#fff;font-size:.82em;transform:rotate(6deg) translateY(-.04em);box-shadow:0 .5vmin 0 #b4471a,0 1.4vmin 2.6vmin rgba(0,0,0,.3);text-shadow:0 .4vmin 0 rgba(140,50,10,.6)}
.card-glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.65);box-shadow:var(--shadow)}
#start p{position:relative;font-size:2.3vmin;max-width:88vmin;line-height:1.5;color:var(--ink);padding:1.6vmin 3vmin;border-radius:2.6vmin;font-weight:700}
#start p b{font-weight:900}
#go{position:relative;font-size:5.6vmin;font-weight:900;padding:2.2vmin 8vmin;border-radius:8vmin;background:linear-gradient(180deg,#ffc94a,#ff8a1f);color:#5a2a00;box-shadow:0 1vmin 0 #c45c0b,0 2.4vmin 4vmin rgba(0,0,0,.3);animation:pulse 2s ease-in-out infinite;display:flex;align-items:center;gap:1.6vmin}
#go:hover{filter:brightness(1.05)}
@keyframes pulse{50%{transform:scale(1.045)}}
.row2{display:flex;gap:1.6vmin;align-items:center;justify-content:center;flex-wrap:wrap}
.chip{position:relative;font-size:2.2vmin;display:flex;gap:1.1vmin;align-items:center;cursor:pointer;font-weight:800;color:var(--ink);padding:1vmin 2.2vmin;border-radius:4vmin}
.chip input{width:2.6vmin;height:2.6vmin;accent-color:var(--teal)}
#instBtn{display:none}.pwa-on #instBtn{display:flex}.pwa-on.pwa-app.pwa-complet #instBtn{display:none}
#ver{position:absolute;right:2.8vmin;bottom:8.6vmin;z-index:3;font-size:1.7vmin;font-weight:800;color:#fff;letter-spacing:.03em;text-shadow:0 .2vmin .6vmin rgba(0,0,0,.55)}
.verc{margin-top:14px;font-size:14px;color:var(--ink2);font-weight:700}
#instM .panel{width:min(620px,94vw)}#instM p{line-height:1.55;margin:0 0 12px}.itot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border:1px solid #d9e2ea;border-radius:16px;padding:16px 20px;margin:16px 0 10px}.itot span{font-weight:700}.itot strong{font-size:30px;letter-spacing:-.02em;color:var(--teal)}
.iparts{list-style:none;margin:0 0 14px;padding:0 20px;display:grid;gap:5px}.iparts li{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2)}.iparts strong{color:var(--ink)}
.ibar{height:14px;border-radius:7px;background:#e1ece9;overflow:hidden;margin:16px 0 8px}.ibar span{display:block;height:100%;background:var(--teal);transition:width .3s}.ixif{display:flex;justify-content:space-between;font-weight:700}
#instM .ih{font-size:13px;color:var(--ink2)}#instM .ierr{color:#b3261e;font-weight:700}#instM .iok{font-weight:700}
.iact{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:10px;margin-top:16px}.iact .ih{flex:1;margin:0}.ib{font:inherit;font-weight:800;font-size:15px;border:1px solid #c9d6df;background:#fff;color:var(--ink);border-radius:999px;padding:9px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}.ib.p{background:var(--teal);border-color:var(--teal);color:#fff}.ib .ic{width:18px;height:18px}
#langs{position:absolute;top:2.2vmin;right:2.2vmin;display:flex;align-items:center;gap:.6vmin;padding:.7vmin .9vmin;border-radius:4vmin;z-index:2;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 4.4vmin)}
#langs .globe{width:3.2vmin;height:3.2vmin;color:var(--ink);margin:0 .3vmin 0 .5vmin;display:flex}
#langs .globe svg{width:100%;height:100%}
#langs button{font-size:1.9vmin;font-weight:800;color:var(--ink);padding:.8vmin 1.4vmin;border-radius:3vmin}
#langs button:hover{background:rgba(29,42,58,.08)}
#langs button.sel{background:var(--ink);color:#fff}
#utac{position:absolute;left:3vmin;bottom:2.6vmin;display:flex;flex-direction:column;align-items:center;gap:.5vmin;text-decoration:none;color:#fff;z-index:2;filter:drop-shadow(0 .4vmin 1vmin rgba(0,0,0,.35))}
#utac img{height:10vmin;width:auto;display:block;filter:brightness(0) invert(1)}
#utac span{font-size:1.8vmin;font-weight:800;letter-spacing:.03em}
#credBtn{position:absolute;right:2.6vmin;bottom:2.6vmin;z-index:3;font-size:2.2vmin;font-weight:800;color:var(--ink);padding:1.1vmin 2.6vmin;border-radius:4vmin}

/* ---- menú ---- */
#menu{z-index:20;flex-direction:column;padding:2.4vmin 3vmin 3vmin;gap:2.2vmin;background:radial-gradient(120% 85% at 15% -10%,#2fb38f 0%,#13695a 45%,#0b3b37 100%)}
#menu::before{content:"";position:absolute;inset:-3vmin;background:linear-gradient(rgba(12,45,35,.28),rgba(12,45,35,.38)),url(portada/fons.webp) center/cover;filter:blur(1.1vmin) saturate(1.05);pointer-events:none}
#menu header{position:relative;display:flex;align-items:center;justify-content:space-between;gap:2vmin}
#menu h1{font-size:5vmin;font-weight:900;display:flex;align-items:center;gap:1.6vmin;text-shadow:0 .4vmin 0 rgba(0,0,0,.18)}
#menu h1 .logo2{font-size:2.4vmin;font-weight:900;padding:.6vmin 1.6vmin;border-radius:3vmin;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3)}
.hb{font-size:2.3vmin;font-weight:800;padding:1.3vmin 2.6vmin;border-radius:3vmin;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);margin-left:1.2vmin;backdrop-filter:blur(8px)}
.hb:hover{background:rgba(255,255,255,.24)}
#grid{position:relative;flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:6.4vmin 7vmin;padding:2.4vmin 7vmin 2vmin;min-height:0}
.card{position:relative;border-radius:2.8vmin;background:rgba(255,255,255,.96);color:var(--ink);display:flex;flex-direction:column;min-height:0;box-shadow:0 .6vmin 0 rgba(0,0,0,.14),0 1.8vmin 3.4vmin rgba(0,20,15,.32);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.card .th{position:relative;flex:1;min-height:0;border-radius:2.8vmin 2.8vmin 0 0;overflow:hidden;background:var(--c);display:flex;align-items:center;justify-content:center}
.card .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .ico{font-size:6.6vmin;line-height:1;filter:saturate(.75) drop-shadow(0 .5vmin .8vmin rgba(0,0,0,.18))}
.card .nm{font-size:1.8vmin;font-weight:900;padding:.9vmin 1vmin 1.1vmin;text-align:center;line-height:1.15}
.card.lock{opacity:.62;cursor:default;box-shadow:0 .4vmin 0 rgba(0,0,0,.12)}
.card .soon,.card .new{position:absolute;left:50%;bottom:1vmin;transform:translateX(-50%);font-size:1.5vmin;font-weight:900;background:rgba(0,0,0,.38);color:#fff;padding:.4vmin 1.3vmin;border-radius:2vmin;white-space:nowrap}
.card .new{left:auto;right:1vmin;top:1vmin;bottom:auto;transform:none;background:linear-gradient(135deg,#ffc94a,#ff7b2c);box-shadow:0 .4vmin 1vmin rgba(0,0,0,.25);text-transform:uppercase;letter-spacing:.04em}
.card.play{outline:.45vmin solid rgba(255,201,74,.9);outline-offset:.2vmin}
.dwell::after{content:"";position:absolute;inset:-1vmin;border-radius:3.6vmin;pointer-events:none;padding:1vmin;background:conic-gradient(#ffd23a calc(var(--p,0)*360deg),transparent 0);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.dwell.hov{transform:scale(1.045)}

/* ---- navegació ---- */
#nav{z-index:10;pointer-events:none;display:none}
#nav.on{display:block}
.nb{pointer-events:auto;position:absolute;top:2vmin;width:11vmin;height:11vmin;border-radius:50%;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.8);box-shadow:0 .5vmin 0 rgba(0,0,0,.14),0 1vmin 2.4vmin rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;transition:transform .2s}
.nb svg{width:50%;height:50%}
.nb.dwell::after{border-radius:50%}
#nPrev{left:2vmin}#nHome{left:2vmin}#nNext{right:2vmin}
#nav.multi #nHome{left:15vmin}
#nav.mini .nb{width:6vmin;height:6vmin;opacity:.5}
#nav.mini.multi #nHome{left:9vmin}
#stitle{position:absolute;top:2.4vmin;left:50%;transform:translateX(-50%);font-size:2.7vmin;font-weight:900;color:var(--ink);padding:.8vmin 2.6vmin;border-radius:3vmin;white-space:nowrap}
/* ull: amaga/mostra títol, modes i navegació (només clic de ratolí, mai amb la mirada) */
#nEye{right:15vmin;cursor:pointer}
#nav.mini #nEye{right:9vmin}
#nav:not(.multi) #nEye,#nav.hideui #nEye{right:2vmin}
#nav.hideui .nb:not(#nEye),#nav.hideui #stitle,#nav.hideui #tray{display:none!important}
#nav.hideui #nEye{opacity:.55}#nav.hideui #nEye:hover{opacity:1}
#tray{position:absolute;top:8.6vmin;left:50%;transform:translateX(-50%);display:flex;gap:.8vmin;padding:.7vmin 1.2vmin;border-radius:3vmin;align-items:center}
#tray img{height:5.4vmin;width:auto;filter:grayscale(1) brightness(1.15) opacity(.45);transition:filter .4s,transform .4s}
#tray img.on{filter:none;transform:scale(1.12)}
#tray.hide{display:none}
#tray .mb{pointer-events:auto;position:relative;font:inherit;font-weight:900;font-size:2.3vmin;border:0;border-radius:2.4vmin;padding:1vmin 2.2vmin;background:rgba(255,255,255,.55);color:var(--ink);cursor:pointer}
#tray .mb.sel{background:#0f766e;color:#fff}
#c3{z-index:1}#nav{z-index:10}

/* ---- opcions ---- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,20,18,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center}
.modal.on{display:flex}
.panel{background:#fff;color:#1a2433;border-radius:20px;padding:22px 26px;width:min(700px,94vw);max-height:92vh;overflow:auto;font-size:16px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.panel h2{font-size:22px;margin-bottom:10px;font-weight:900}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #edf0f2;font-weight:700}
.seg{display:flex;border-radius:12px;overflow:hidden;border:1px solid #c9d6d4;flex-wrap:wrap;background:#f4f7f7}
.seg button{padding:7px 12px;font-size:14px;color:#134e48;font-weight:800}
.seg button.sel{background:var(--sel);color:#fff}
.row input[type=range]{width:210px;accent-color:var(--teal)}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--teal)}
.stat{margin-top:12px;font-weight:700}
.eyeset{background:#eef7f6;border-radius:12px;padding:10px 14px;margin:0 0 8px;font-size:14px;line-height:1.45}
.eyeset h3{font-size:17px;font-weight:900;color:#17676b;margin:0 0 4px}
.eyeset p{margin:4px 0}
.keys{font-size:13px;color:#556;margin-top:8px;line-height:1.9}
.keys kbd{background:#f0f2f4;border-radius:5px;padding:1px 6px;font-family:inherit;border:1px solid #cdd3d9}
.btnP{margin-top:14px;background:var(--teal);color:#fff;padding:10px 26px;border-radius:12px;font-weight:900}
#iLang{font:inherit;font-size:15px;padding:5px 8px;border-radius:9px;border:1px solid #c9d6d4;color:#134e48;font-weight:800}
.credits{font-size:12px;color:#667;margin:10px 0 6px;line-height:1.35}
#cred .panel{line-height:1.5}
#cred h3{font-size:18px;font-weight:900;color:#17676b;margin:14px 0 6px}
#cred .panel>p{margin:0 0 8px}
#cred .insts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px 24px;margin:14px 0 6px}
#cred .insts figure{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0;text-align:center}
#cred .insts a{display:flex;align-items:center;justify-content:center;width:100%;height:72px;border-radius:8px}
#cred .insts img{max-width:100%;max-height:100%;object-fit:contain}
#cred .insts figcaption{color:#5b6670;font-size:13px;line-height:1.35}
#cred ul.cl{margin:6px 0 0;padding-left:18px;font-size:14px}
#cred ul.cl li{margin:3px 0}
#cred a{color:#0f766e}
#toast{position:fixed;left:50%;bottom:4vmin;transform:translateX(-50%);background:rgba(10,25,22,.85);padding:1.4vmin 3vmin;border-radius:3vmin;font-size:2.5vmin;font-weight:800;z-index:70;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#load{position:fixed;left:50%;bottom:1.6vmin;transform:translateX(-50%);width:28vmin;height:.7vmin;border-radius:1vmin;background:rgba(255,255,255,.25);overflow:hidden;z-index:31;transition:opacity .5s}
#load i{display:block;height:100%;width:0;background:#ffd23a;transition:width .3s}
#menu.hold{display:flex!important;z-index:9500;pointer-events:none}#iring{position:fixed;left:0;top:0;border:.9vmin solid rgba(255,214,90,.92);border-radius:50%;pointer-events:none;z-index:9600;display:none;box-shadow:0 0 2vmin rgba(255,200,60,.45)}
.card.chosen{animation:chosen .5s ease-in-out both!important;z-index:5}@keyframes chosen{0%{transform:scale(1)}45%{transform:scale(1.09);box-shadow:0 0 0 .7vmin #ffd23a,0 0 4vmin 1vmin rgba(255,210,58,.85)}100%{transform:scale(1.04);box-shadow:0 0 0 .7vmin #ffd23a,0 0 3vmin rgba(255,210,58,.6)}}
#iris{position:fixed;inset:0;width:100vw;height:100vh;z-index:9000;pointer-events:none;display:none}#iris.on{display:block;pointer-events:auto}
.pout{animation:pout .38s cubic-bezier(.4,-.6,.8,.4) both!important}.pin{animation:pin .55s cubic-bezier(.3,1.7,.5,1) both!important}
@keyframes pout{0%{transform:scale(1);opacity:1}35%{transform:scale(1.12);opacity:1}100%{transform:scale(0);opacity:0}}
@keyframes pin{0%{transform:scale(0);opacity:0}50%{opacity:1}100%{transform:scale(1);opacity:1}}
#menu.on::before{animation:mblur .6s ease-out both}@keyframes mblur{from{filter:blur(0);opacity:.6}}
#start.unblur .bg{animation:sblur .6s ease-out both}@keyframes sblur{from{filter:blur(1.1vmin)}}
@media (prefers-reduced-motion: reduce){.pout{animation:fo .3s both!important}.pin{animation:fo .3s reverse both!important}@keyframes fo{to{opacity:0}}#menu.on::before,#start.unblur .bg{animation:none}}
@media (prefers-reduced-motion: reduce){#start .bg,#parade .pc,#parade img,#go{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start" class="scr on">

    if(V2D[n]||!p.classList.contains('vid')){const c=V2D[n]||'hop';p.classList.remove(c);void p.offsetWidth;p.classList.add(c);tm=setTimeout(next,2400);return}
    p.s.rep=0;p.s.currentTime=0;p.s.play().then(()=>{p.s.classList.add('on');p.r.classList.remove('on');p.r.pause()}).catch(()=>{tm=setTimeout(next,1500)})}
  function sync(){const on=vis();for(const p of P)if(p.r){if(on&&p.r.classList.contains('on')||on&&!p.classList.contains('vid'))p.r.play().catch(()=>{});else if(!on)p.r.pause()}}
